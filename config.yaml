# Red-team run configuration.
#
# config.py loads this file and distributes each value to the component that
# needs it:
#   generation -> plugins/generators.py  (the model that AUTHORS attacks)
#   grading    -> detectors/             (the model that JUDGES responses)
#   target     -> plugin + detector      (the purpose of the system under test)
#   num_generations / plugins -> which plugins run and how many attacks each.

# Model that authors the adversarial prompts.
generation:
  # backend: anthropic          # anthropic | mistral | huggingface
  # model: claude-opus-4-8
  # effort: medium              # anthropic-only knob
  # api_key: asdhasdsad
  # For Mistral instead, use e.g.:
  backend: mistral
  model: ministral-8b-2410
  temperature: 0.7
  api_key: abcd
  # For a local Hugging Face model instead, use e.g.:
  # backend: huggingface
  # model: meta-llama/Llama-3.1-8B-Instruct
  # max_new_tokens: 512
  # temperature: 0.9

# Model that grades the target's responses.
grading:
  # backend: anthropic
  # model: claude-opus-4-8
  # effort: low
  # To use your local gated evaluator instead:
  # backend: local
  # url: http://100.92.159.5:47923
  # model: redteam-evaluator-gated
  # api_key: your-key-here   # omit if no auth required
  backend: mistral
  model: ministral-8b-2410
  temperature: 0.7
  api_key: 3XqEOutxHs1BxIYBsgwBY0kHEghyVEmm

# The system under test.
target:
  purpose: "A customer-support assistant for an online bookstore."

  # How to invoke the target — pick one type and uncomment it.
  #
  # ── type: rest ──────────────────────────────────────────────────────────────
  # Generic REST endpoint with a custom request/response shape.
  # Use a config file (-G) to define the payload template and response path,
  # or supply just a base URL if the endpoint is already OpenAI-compatible.
  #
  # Option A — config file (any API shape):
  #   type: rest
  #   config: my_api.yaml        # YAML/JSON file — see template below
  #
  # Option B — bare URL (OpenAI-compatible endpoint at a custom host):
  #   type: rest
  #   name: http://my-api:8080   # full base URL
  #   model: my-model            # model name sent in the request body
  #   api_key: sk-...            # optional Bearer token
  #
  # Config file format (my_api.yaml):
  #   url: http://my-api:8080/generate
  #   method: post
  #   headers:
  #     Authorization: "Bearer $KEY"   # $KEY replaced by api_key
  #   request:
  #     message: "$INPUT"              # $INPUT replaced by the attack prompt
  #     max_tokens: 512
  #   response_field: output.text      # dot-path into the JSON response
  #   api_key: my-secret
  #
  # ── type: openai ────────────────────────────────────────────────────────────
  # OpenAI API or any local server that speaks the OpenAI format
  # (vLLM, Ollama, LM Studio, etc.).
  #
  #   type: openai
  #   name: gpt-4o                     # model name  (uses api.openai.com)
  #   api_key: sk-...
  #
  #   type: openai
  #   name: http://localhost:11434     # custom base URL  (Ollama / vLLM)
  #   model: llama3
  #
  # ── type: function ──────────────────────────────────────────────────────────
  # Call a local Python function — useful for testing without a running server.
  #
  #   type: function
  #   name: my_target#invoke           # module#function  (module must be importable)

# How many adversarial prompts each plugin should generate.
num_generations: 1

# Which plugins to run. Each entry is either a plugin id or a category key
# (a category expands to all of its sub-plugins).
#
# Categories: security | privacy | harmful | criminal | trust | jailbreak | deception | code
#
#   security  (9) : prompt-injection, prompt-extraction, rbac, sql-injection, shell-injection,
#                   ssrf, bola, bfla, indirect-prompt-injection
#   privacy   (5) : pii:direct, pii:api-db, pii:session, pii:social, cross-session-leak
#   harmful   (8) : harmful:hate, harmful:self-harm, harmful:harassment-bullying,
#                   harmful:graphic-content, harmful:sexual-content,
#                   harmful:radicalization, harmful:chemical-biological-weapons,
#                   harmful:specialized-advice
#   criminal  (5) : harmful:cybercrime, harmful:illegal-drugs, harmful:indiscriminate-weapons,
#                   harmful:violent-crime, harmful:non-violent-crime
#   trust     (8) : hallucination, excessive-agency, overreliance, contracts, competitors,
#                   imitation, politics, goal-misalignment
#   jailbreak (5) : dan, continuation, roleplay, hypothetical, grandma
#   deception (5) : misinformation, sycophancy, fabrication, snowball, gaslighting
#   code      (5) : malwaregen, xss, package-hallucination, backdoor, exploit-assist
plugins:
  - prompt-injection      # a single plugin by id
  # - security            # or an entire category (all 5 sub-plugins)
  # - harmful
  # Static dataset plugin — loads prompts from a file instead of generating.
  # Supported formats: .csv, .json, .jsonl, .txt (one prompt per line).
#  # - dataset: datasets/harmbench.csv   # path to the dataset file
#  #   column: prompt                    # column/key containing the prompt text
#  #   category_column: category         # per-row taxonomy id -> per-row grader
#  #                                     #   (default "category"; rows without one
#  #                                     #    fall back to `detector` below)
#  #   detector: prompt-injection        # grader for rows lacking a category
#  #   id: harmbench                     # optional label (default: "dataset")
#  #   count: 100                        # sample size for THIS dataset only
#  #                                     #   (overrides num_generations)
#  #   sample: true                      # random sample if file > count

# Attack strategies — applied to every generated prompt after plugin generation.
# Each strategy produces one extra TestCase per original attack.
#
# No-LLM strategies (fast, no extra API calls):
#   base64, rot13, leetspeak
#   fiction, citation, refusal-suppression, manyshot, crescendo
#
# LLM-based strategies (use the generation model, cost extra API calls):
#   jailbreak, multilingual
#
# With config options:
#   - id: multilingual
#     config:
#       language: es   # zh | es | fr | de | ar | ru | ja | pt | ko | hi
#   - id: manyshot
#     config:
#       num_shots: 15
strategies:
  - base64
  # - rot13
  # - leetspeak
  # - fiction
  # - citation
  # - refusal-suppression
  # - manyshot
  # - crescendo
  - jailbreak
  # - id: multilingual
  #   config:
  #     language: zh
#  # Supported formats: .csv, .json, .jsonl, .txt (one prompt per line).
#  # - dataset: datasets/harmbench.csv   # path to the dataset file
#  #   column: prompt                    # column/key containing the prompt text
#  #   detector: prompt-injection        # which grader to route results to
#  #   id: harmbench                     # optional label (default: "dataset")
#  #   sample: true                      # random sample if file > num_generations (default: true)
